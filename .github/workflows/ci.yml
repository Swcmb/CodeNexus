# ============================================================================
# CI 工作流: lint + test + build
# 触发条件: push/PR 到 main 分支
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的多次推送只保留最新的运行，取消之前的排队任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 代码质量检查: black, isort, flake8, mypy
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-${{ matrix.python-version }}-

      - name: 安装项目及开发依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 检查 black 格式化
        run: black --check --diff src/ tests/

      - name: 检查 isort 导入排序
        run: isort --check-only --diff src/ tests/

      - name: flake8 代码检查
        run: flake8 src/ tests/

      - name: mypy 类型检查
        run: mypy src/

  # ---------------------------------------------------------------------------
  # 测试矩阵: pytest + coverage, Python 3.9-3.12
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}-

      - name: 安装项目及测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: 运行单元测试
        run: |
          pytest tests/unit/ \
            --tb=short \
            -q

      - name: 运行属性测试
        run: |
          pytest tests/property/ \
            --tb=short \
            -q

      - name: 运行集成测试
        run: |
          pytest tests/integration/ \
            --tb=short \
            -q

      - name: 生成覆盖率报告
        run: |
          pytest tests/ \
            --cov=src/codenexus \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --tb=short \
            -q

      - name: 上传覆盖率报告
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # 构建验证: 确保项目可正确打包
  # ---------------------------------------------------------------------------
  build:
    name: Build & Verify Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: 构建 sdist 和 wheel
        run: python -m build

      - name: 验证包元数据
        run: twine check dist/*

      - name: 验证 wheel 可安装
        run: |
          pip install dist/*.whl
          python -c "import codenexus; print(f'codenexus {codenexus.__name__} imported successfully')" || \
          python -c "from codenexus.cli import cli; print('CLI entry point verified')"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
